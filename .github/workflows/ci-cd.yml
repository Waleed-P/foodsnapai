name: Build, Test and Push Docker Images

on:
  push:
    branches: [main]

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

  # Image Names
  FRONTEND_IMAGE: foodsnapai-frontend
  API_GATEWAY_IMAGE: foodsnapai-api-gateway
  AUTH_SERVICE_IMAGE: foodsnapai-auth-service
  FOOD_SERVICE_IMAGE: foodsnapai-food-service

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Frontend Tests
        working-directory: ./frontend
        run: npm run test

  docker:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build & Push Frontend Image
      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.DOCKER_USERNAME }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

      # Build & Push API Gateway Image
      - name: Build and Push API Gateway
        uses: docker/build-push-action@v6
        with:
          context: ./backend/api-gateway
          file: ./backend/api-gateway/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/${{ env.API_GATEWAY_IMAGE }}:latest
            ${{ env.DOCKER_USERNAME }}/${{ env.API_GATEWAY_IMAGE }}:${{ github.sha }}

      # Build & Push Auth Service Image
      - name: Build and Push Auth Service
        uses: docker/build-push-action@v6
        with:
          context: ./backend/auth-service
          file: ./backend/auth-service/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/${{ env.AUTH_SERVICE_IMAGE }}:latest
            ${{ env.DOCKER_USERNAME }}/${{ env.AUTH_SERVICE_IMAGE }}:${{ github.sha }}

      # Build & Push Food Service Image
      - name: Build and Push Food Service
        uses: docker/build-push-action@v6
        with:
          context: ./backend/food-service
          file: ./backend/food-service/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/${{ env.FOOD_SERVICE_IMAGE }}:latest
            ${{ env.DOCKER_USERNAME }}/${{ env.FOOD_SERVICE_IMAGE }}:${{ github.sha }}